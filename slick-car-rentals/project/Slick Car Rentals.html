<!doctype html>
<html lang="en">
<head>

  <title>Slick Car Rentals — Melton VIC</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="root"></div>

  <script>

      "accent": "#D4A24C",
      "heroVariant": "split",

  <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>

  <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>

  <!-- data -->
  <script src="src/data.js"></script>

  <!-- tweaks panel (defines useTweaks, TweaksPanel, etc.) -->

  <script type="text/babel" src="src/components.jsx"></script>
  <script type="text/babel" src="src/calendar.jsx"></script>

  <!-- pages -->
  <script type="text/babel" src="src/landing.jsx"></script>
  <script type="text/babel" src="src/fleet.jsx"></script>
  <script type="text/babel" src="src/booking.jsx"></script>
  <script type="text/babel" src="src/admin.jsx"></script>

  <!-- app shell -->
  <script type="text/babel" src="src/app.jsx"></script>

  <!-- mount -->
  <script type="text/babel">
    const root = ReactDOM.createRoot(document.getElementById("root"));
    root.render(<App />);
  </script>

</html>
